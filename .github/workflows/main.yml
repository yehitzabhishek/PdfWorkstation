name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p /tmp/gradle-gen gradle/wrapper
          (cd /tmp/gradle-gen && gradle wrapper --gradle-version 8.7)
          cp /tmp/gradle-gen/gradlew ./gradlew
          cp /tmp/gradle-gen/gradle/wrapper/gradle-wrapper.jar ./gradle/wrapper/gradle-wrapper.jar
          if [ ! -s gradle/wrapper/gradle-wrapper.properties ]; then
            cp /tmp/gradle-gen/gradle/wrapper/gradle-wrapper.properties ./gradle/wrapper/gradle-wrapper.properties
          fi
          sed -i 's/\r$//' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
